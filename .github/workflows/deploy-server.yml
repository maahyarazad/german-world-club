name: Deploy GWC Server

on:
  push:
    branches: [main]
  workflow_dispatch:

# Two pushes in a row must not interleave their uploads on the host.
concurrency:
  group: deploy-server
  cancel-in-progress: false

env:
  DEST_DIR: staging.german-world-club.com

jobs:
  deploy-server:
    name: Build & Deploy Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install production dependencies (server + contracts only)
        run: npm ci --omit=dev --workspace=server --workspace=packages/contracts --include-workspace-root --no-audit --no-fund

      - name: Check the bundle resolves
        working-directory: server
        run: node --input-type=module -e "await import('@gwc/contracts/errors'); await import('fastify'); console.log('dependencies resolve')"

      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Upload dependencies and contracts
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          SSH="ssh -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=no"
          DEST="${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:~/$DEST_DIR"

          sshpass -e rsync -az -e "$SSH" package.json package-lock.json "$DEST/"
          sshpass -e rsync -az --delete -e "$SSH" node_modules/ "$DEST/node_modules/"
          sshpass -e rsync -az --delete --exclude='/tests/' -e "$SSH" \
            packages/contracts/ "$DEST/packages/contracts/"

      - name: Upload server
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          # Host-owned paths are excluded so --delete cannot remove them: its
          # .env files, keys placed by hand, and runtime data.
          sshpass -e rsync -avz --delete \
            --exclude='/.env' --exclude='/.env.*' --exclude='/*-firebase-adminsdk*.json' \
            --exclude='/german-world-club-*.json' --exclude='/.seed-credentials.md' \
            --exclude='/logs/' --exclude='/var/' --exclude='/file_storage/' \
            --exclude='/tests/' --exclude='/coverage/' \
            -e "ssh -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=no" \
            server/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:~/$DEST_DIR/server/

      - name: Verify deployment
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          sshpass -e ssh -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=no \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "cd ~/$DEST_DIR && ls -la . server packages/contracts && ls -la node_modules/@gwc/ \
             && echo \"host node: \$(command -v node && node -v || echo 'not on PATH for non-interactive ssh')\""
