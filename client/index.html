    <link rel="canonical" href="https://expertscircle.german-emirates-club.com/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="German Emirates Club" />
    <meta property="og:title" content="Experts Circle — German Emirates Club" />
    <meta
      property="og:description"
      content="A private network of German and Emirati specialists. Launching soon."
    />

    <style>
      /* Critical boot styles. Paints a branded first screen from HTML alone,
         before the React bundle has downloaded or executed. React replaces
         #boot on mount; it is also what a visitor without JavaScript sees.
         Values mirror Hero.jsx so replacing it causes no layout shift. */
      :root { color-scheme: dark }
      html, body { margin: 0; background: #1a0b0a }
      #boot {
        min-height: 100svh; box-sizing: border-box;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        padding: 5rem 1.25rem; text-align: center; color: #fff8f0;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
        background:
          radial-gradient(1100px 620px at 50% -12%, rgba(204,0,51,.48), transparent 62%),
          radial-gradient(760px 420px at 82% 18%, rgba(174,40,53,.30), transparent 64%),
          linear-gradient(180deg, #750a04 0%, #4a0603 58%, #1a0b0a 100%);
      }
      #boot .mark { color: #c9a227 }
      #boot .org {
        margin: 2rem 0 0; font-size: .7rem; font-weight: 600;
        letter-spacing: .32em; text-transform: uppercase; color: #f5d0d0;
      }
      #boot h1 {
        margin: 1.25rem 0 0; font-weight: 500; line-height: 1.05; letter-spacing: -.025em;
        font-family: ui-serif, Georgia, Cambria, "Times New Roman", serif;
        font-size: clamp(2.5rem, 11vw, 5.5rem);
      }
      #boot .rule {
        margin: 2rem 0 0; width: 8rem; height: 1px;
        background: linear-gradient(90deg, transparent, rgba(201,162,39,.7), transparent);
      }
      #boot .tag {
        margin: 2rem 0 0; max-width: 36rem; font-size: 1rem; line-height: 1.7; color: #f5d0d0;
      }
      #boot .pill {
        margin: 2.5rem 0 0; display: inline-flex; align-items: center; gap: .625rem;
        border: 1px solid rgba(201,162,39,.4); border-radius: 999px; padding: .625rem 1.25rem;
        font-size: .75rem; font-weight: 500; letter-spacing: .18em; text-transform: uppercase;
        color: #c9a227;
      }
      @media (min-width: 640px) { #boot .tag { font-size: 1.125rem } }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot">
        <svg class="mark" width="84" height="84" viewBox="0 0 80 80" fill="none" role="img" aria-label="Experts Circle — German Emirates Club">
          <circle cx="40" cy="40" r="38" stroke="currentColor" stroke-opacity=".25"/>
          <circle cx="40" cy="40" r="27" stroke="currentColor" stroke-opacity=".55" stroke-width="1.25"/>
          <text x="40" y="40" text-anchor="middle" dominant-baseline="central" fill="currentColor"
                font-family="ui-serif, Georgia, serif" font-size="23" font-weight="500">EC</text>
        </svg>
        <p class="org">German Emirates Club</p>
        <h1>Experts Circle</h1>
        <div class="rule"></div>
        <p class="tag">A private network of German and Emirati specialists — opening soon.</p>
        <p class="pill">Launching soon</p>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
